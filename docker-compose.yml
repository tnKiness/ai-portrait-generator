services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: portrait
      POSTGRES_PASSWORD: portrait
      POSTGRES_DB: portrait
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portrait"]
      interval: 2s
      retries: 20

  api:
    build: .
    command: ["node", "server/dist/web.js"]
    profiles: ["app"]
    environment: &app-env
      DATABASE_URL: postgres://portrait:portrait@db:5432/portrait
      HOST: 0.0.0.0
      PORT: 3000
      STORAGE_DIR: /data/storage
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: ["node", "server/dist/worker.js"]
    profiles: ["app"]
    environment: *app-env
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  storage:
